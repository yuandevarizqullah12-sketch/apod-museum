<body>

  <header class="top">
    <div class="wrap">
      <a class="brand" href="index.html">APOD MUSEUM</a>
      <button id="menu" type="button" aria-expanded="false" aria-controls="nav">Menu</button>
      <nav id="nav" aria-label="Main">

    <section class="block" aria-labelledby="page-title">

        <div class="head">
          <div>
            <p class="eyebrow">June 16, 1995 – today</p>
            <h1 id="page-title" class="title-sm">Archive</h1>
          </div>
        </div>

        <form class="ctl" id="controls" aria-label="Browse the archive">
          <label>Open a date
            <input type="date" id="date" min="1995-06-16">
          </label>
          <label>Year
            <select id="year"></select>
          </label>
          <label>Month
            <select id="month"></select>
          </label>
          <button class="btn" id="go" type="submit">Browse</button>
          <button class="btn" id="latest" type="button">Latest</button>
        </form>

        <p id="status" class="sr-only" role="status" aria-live="polite"></p>
        <div id="grid" class="grid" aria-live="polite"></div>

        <div class="more">
          <button class="btn" id="more" type="button" hidden>Load more</button>
        </div>
      </div>
    </section>
  </main>
